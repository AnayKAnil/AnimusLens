<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Institution - AnimusLens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
    }
    .form-control:focus {
      background-color: #0f172a;
      border-color: #38bdf8;
      color: #f8fafc;
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
    }
    .form-control::placeholder {
      color: #64748b;
    }
    .text-muted {
      color: #94a3b8 !important;
    }
    .btn-success {
      background-color: #16a34a;
      border: none;
    }
    .btn-success:hover {
      background-color: #15803d;
    }
    a {
      color: #38bdf8;
    }
    a:hover {
      color: #7dd3fc;
    }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4 border-0 rounded-4">
          <h3 class="fw-bold text-center mb-1 text-white">Register Institution</h3>
          <p class="text-muted text-center small mb-4">Set up issuance authority on AnimusLens</p>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Institution Name</label>
              <input type="text" name="name" class="form-control" placeholder="e.g. Nirmala College" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Official Email</label>
              <input type="email" name="email" class="form-control" placeholder="admin@university.edu" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Create Account</button>
          </form>

          <div class="text-center mt-3 small text-muted">
            Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
